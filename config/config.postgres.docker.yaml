# Configuration used by docker-compose.postgres.yml.
server:
  name: stemson_backend
  http:
    host: 0.0.0.0
    port: 8080
    request_max_size: 10485760
    request_timeout: 30
  jwt:
    secret: "change-me-in-production"
    expires_in: 1800
  auth:
    # opaque: only OPAQUE (recommended). both: OPAQUE + Argon2id password login
    # for accounts that still carry a hash (migration/bootstrap). password: legacy.
    mode: both
    opaque:
      setup_file: "/app/opaque/server_setup.bin"
      session_ttl: 120
      # reject a login session that was already used (async replay)
      single_use: true
      # memory: this process only; redis: shared by all replicas
      nonce_store: memory

  cors:
    allowed_origins: ["*"]
  snowflake:
    datacenter_id: 1
    worker_id: 2
  log:
    level: INFO
    debug: false
    format: "[%(asctime)s %(levelname)s ] [%(filename)s:%(lineno)d %(module)s.%(funcName)s] %(message)s"
    filename: "logs/run.log"
    backupCount: 10
    maxBytes: 102400
  config_watch: false

datasource:
  # mysql (default), postgres (also accepts postgresql / pgsql), sqlite
  driver: postgres
  postgres:
    db_name: stemson_backend_system
    host: postgres
    user: stemson
    password: "stemson"
    port: 5432
    max_usage: 30
    acquire_timeout: 10

redis:
  host: redis
  port: 6379
  db: 0
  password: ""
