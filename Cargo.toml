[package]
name = "stemson"
version = "2.0.0"
edition = "2021"
rust-version = "1.91"
description = "Stemson: a Spring-Boot-like web framework on top of Axum (Rust port of SanicBoot)"
license = "MIT"
readme = "README.md"

[workspace]
members = ["stemson-macros"]

[dependencies]
stemson-macros = { path = "stemson-macros" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["timeout", "util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic", "timeout"] }
http = "1"
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
serde_urlencoded = "0.7"
arc-swap = "1"
notify = "8"
multer = "3"
futures-util = "0.3"
anyhow = "1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "json", "macros"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }

jsonwebtoken = "9"
argon2 = "0.5"

utoipa = { version = "5", features = ["axum_extras", "chrono", "preserve_order"] }
# `vendored` embeds the Swagger UI assets in the crate: no network access is
# needed at build time (the default build script downloads them from GitHub).
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "registry"] }
tracing-appender = "0.2"

inventory = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_urlencoded = "0.7"
